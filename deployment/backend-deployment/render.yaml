# render.yaml — Render.com Deployment Config
# Deploy from: https://dashboard.render.com/select-repo

services:
  - type: web
    name: lendloop-api
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    rootDir: backend
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: lendloop-db
          property: connectionString
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CREDENTIALS_PATH
        value: ./firebase-adminsdk.json
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: QR_TOKEN_SECRET
        generateValue: true
      - key: ALLOWED_EMAIL_DOMAINS
        value: vit.ac.in,vitstudent.ac.in

  - type: pserv
    name: lendloop-db
    runtime: postgresql
    plan: free
    region: singapore
